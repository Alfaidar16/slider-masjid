<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kumpulan Video</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>
  <video id="player" autoplay muted loop playsinline></video>

<script>
  var VIDEOS = ['video1.mp4', 'video2.mp4', 'video3.mp4'].map(function (f) {
    return '/kumpulan-video/' + f;
  });
  var idx = 0;
  var player = document.getElementById('player');
  player.loop = false;

  function playCurrent() {
    player.src = VIDEOS[idx];
    player.play().catch(function () {});
  }

  player.addEventListener('ended', function () {
    idx = (idx + 1) % VIDEOS.length;
    playCurrent();
  });

  playCurrent();
</script>
</body>
</html>
